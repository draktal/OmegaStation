# Omega station: checkthiskd lic.

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseHitmanObjective
  components:
  - type: Objective
    issuer: objective-issuer-syndicate
  - type: RoleRequirement
    roles:
    - HitmanRole

- type: entity
  parent: [BaseHitmanObjective, BaseLivingObjective]
  id: EscapeShuttleObjective
  name: Добраться до Центкома живым и невредимым.
  description: Один из наших тайных агентов проведёт с вами инструктаж по прибытии на эвакуационном шаттле. Не приходите в наручниках.
  components:
  - type: Objective
    difficulty: 1.3
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition

- type: entity
  parent: [BaseHitmanObjective, BaseKillObjective]
  id: KillRandomPersonObjective
  description: Устраните свою жертву любыми способами. Она не должна уйти со станции.
  components:
  - type: Objective
    difficulty: 1.75
    unique: false
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: PickRandomPerson
  - type: KillPersonCondition
    requireMaroon: true

- type: entity
  parent: [BaseHitmanObjective, BaseKillObjective]
  id: KillRandomHeadObjective
  description: Устраните члена высшего командования любыми способами. За это вам гарантируется доплата. Не дайте жертве уйти со станции.
  components:
  - type: Objective
    difficulty: 3.0
    unique: true
  - type: TargetObjective
    title: objective-condition-kill-maroon-title
  - type: PickRandomHead
  - type: KillPersonCondition
    requireDead: true
    requireMaroon: true
