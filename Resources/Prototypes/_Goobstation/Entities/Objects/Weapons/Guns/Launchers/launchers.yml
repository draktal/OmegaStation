- type: entity
  name: GL-06 riot grenade launcher
  parent: [WeaponFlareGun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponLauncherNonLethal
  description: Essentially a scaled up flare gun that takes 40mm shells; mechanical safety features prevent the loading and firing of lethal grenades.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/riotlauncher.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/riotlauncher.rsi
    slots:
    - Back
    - suitStorage
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.5
  - type: Item
    size: Huge
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/riotlauncher.rsi
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - NonLethalGrenade

- type: entity
  name: M172 РПГ # Omega station local
  parent: [ BaseWeaponLauncher, BaseMajorContraband, BaseGunWieldable] # Major contra because it isn't manufactured by the syndicate; NT would use this
  id: WeaponLauncherRocketDisposable
  description: Однозарядное 84-мм лёгкое противотанковое оружие одноразового использования для точного поражения строений с минимальным сопутствующим ущербом. Для удобства хранения его можно сложить. НЕ ПЫТАЙТЕСЬ ИЗВЛЕЧЬ РАКЕТУ ИЗ ТРУБКИ. # Omega station local
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/m172.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/m172.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1 # normal size
    storedSprite:
      sprite: _Goobstation/Objects/Weapons/Guns/Launchers/m172.rsi
      state: storage
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Appearance
  - type: Gun
    fireRate: 0.75
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: GunRequiresWield
  - type: BasicEntityAmmoProvider
    proto: BulletRocketLAW
    capacity: 1
  - type: UseDelay
    delay: 1.5

- type: entity
  name: РПГ-А 'Шмель' # Omega station local
  parent: [ BaseWeaponLauncher, BaseMajorContraband, BaseGunWieldable] # Same as above
  id: WeaponLauncherRocketDisposableThermobaric
  description: Одноразовый 93-мм противопехотный термобарический реактивный гранатомет, который производитель считает огнеметом. Для удобства хранения его можно сложить. # Omega station local
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/shmel.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/shmel.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
    storedSprite:
      sprite: _Goobstation/Objects/Weapons/Guns/Launchers/shmel.rsi
      state: storage
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Appearance
  - type: Gun
    fireRate: 0.75
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: GunRequiresWield
  - type: BasicEntityAmmoProvider
    proto: BulletRocketShmel
    capacity: 1
  - type: UseDelay
    delay: 1.5
