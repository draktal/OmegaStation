# Omega Station localisation: checkthiskd lic.

- type: entity
  id: XenoTunnel
  name: Туннель
  description: Вход в туннель. Похоже, что его прорыл какой-то когтистый зверь.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: hole
    noRot: true
  - type: InteractionOutline
  - type: Clickable

- type: entity
  parent: XenoTunnel
  id: XenoTunnelMaint
  name: Технический ксено-туннель
  description: Вход в технический ксено-туннель. Внутри вы можете увидеть кусочки слизи и смолы. Обломки не дают вам рассмотреть их поближе.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: maintenancehatch_alt

- type: entity
  parent: XenoTunnelMaint
  id: XenoTunnelMaintNoXenoDesc
  description: Вход в технический ксено-туннель. Внутри вы можете увидеть кусочки слизи и смолы. Обломки не дают вам рассмотреть их поближе.

