  description: "Огромный индустриальный контейнер для перевозок.\nЭтот продукт от компании Pathos, производителя компьютерных комплектующих и датчиков движения.\nВы все еще задаетесь вопросом, почему у нас есть контейнер со старыми датчиками движения, и работают ли они еще." # Omega Station local
