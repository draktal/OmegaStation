- type: entity
  parent: RMCContainerBase
  id: RMCContainerFujinLeft
  name: Грузовой контейнер "Фьюджен" # Omega station local
  description: "Огромный индустриальный контейнер для перевозок.\nЭтот продукт от компании Fujin, производителя разнообразной электронной и механической продукции.\nПо крайней мере, так написано на упаковке. Вы буквально никогда раньше не слышали об этой компании." # Omega station local
