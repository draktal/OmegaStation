  description: "Огромный промышленный грузовой контейнер.\nЭтот принадлежит Азиатскому промышленному коллективу, вошедшему в состав Азиатской промышленной партии (SPP). Благодаря их огромному промышленному производству грузовые контейнеры с их символикой и названием не исчезнут в ближайшее время." # Omega station local
