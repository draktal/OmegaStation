    state: fujincontainermiddle

- type: entity
  parent: RMCContainerBase
  id: RMCContainerApocraphyLeft
  name: Грузовой контейнер "Апократия" # Omega station local
  description: "Огромный индустриальный контейнер для перевозок\nЭтот продукт от корпорации Apocrahpy, производителя медицинских и биотехнологических деталей.\nВы помните, как слышали об одном из их последних препаратов и насколько он был опасен... Хотя они утверждали, что близки к нахождению решения." # Omega station local
  suffix: Apocraphy, Left
