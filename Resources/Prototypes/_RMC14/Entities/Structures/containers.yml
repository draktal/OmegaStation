  description: "Огромный индустриальный контейнер для перевозок.\nЭтот экземпляр от Ferret Heavy Industries, производителя наземных гусеничных тракторов и погрузчиков.\nК сожалению, компания обанкротилась. К счастью, эти контейнеры сейчас очень дёшевы." # Omega station local
